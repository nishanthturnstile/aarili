name: Aarili verification

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    # Daily dependency advisory check; schedules activate after merge to main.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aarili-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  scaffold:
    name: Scaffold verification
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Lint, boundaries, tokens, Knip, types, unit/negative/PostgreSQL tests, build and production smoke
        run: pnpm verify
      - name: Private configuration canary build
        env:
          AARILI_PRIVATE_PROBE: aarili-private-probe-issue-2
          SETUP_TOKEN: aarili-setup-probe-issue-12
          GOOGLE_DEV_CLIENT_SECRET: aarili-google-private-probe-issue-14
          GOOGLE_PROD_CLIENT_SECRET: aarili-google-private-probe-issue-14
        run: pnpm --filter @aarili/web build && node scripts/check-artifacts.mjs

  browser:
    name: Browser smoke and accessibility
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Install Linux Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Phone, tablet and desktop smoke/axe with disposable PostgreSQL
        run: pnpm test:ui

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Audit runtime and development dependencies
        run: pnpm audit --audit-level low
