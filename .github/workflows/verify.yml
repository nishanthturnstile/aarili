name: Aarili verification

on:
  pull_request:
    branches: [development, main]
  schedule:
    # Daily dependency advisory check against the default development branch.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aarili-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  fast:
    name: Fast verification
    # Fast, Docker-free subset for PRs into development. The full scaffold
    # verification (real-PostgreSQL integration, PDF goldens, production smoke and
    # the private-configuration canary) runs on the development -> main promotion
    # PR and on manual dispatch. This subset is a strict part of that full check.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'development')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Lint, boundaries, tokens, Knip, strict types, unit/negative types, OpenAPI and production build
        run: pnpm verify:fast

  scaffold:
    name: Scaffold verification
    # Full verification for release promotion to main, not every PR into development.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Lint, boundaries, tokens, Knip, types, unit/negative/PostgreSQL isolation catalog and drift tests, build and production smoke
        run: pnpm verify
      - name: Private configuration canary build
        env:
          AARILI_PRIVATE_PROBE: aarili-private-probe-issue-2
          SETUP_TOKEN: aarili-setup-probe-issue-12
          GOOGLE_DEV_CLIENT_SECRET: aarili-google-private-probe-issue-14
          GOOGLE_PROD_CLIENT_SECRET: aarili-google-private-probe-issue-14
        run: pnpm --filter @aarili/web build && node scripts/check-artifacts.mjs

  browser_matrix:
    name: Browser checks (${{ matrix.viewport }})
    # Run the full browser suite for release promotion, not every PR into development.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    # The full suite now has 150 cases; keep each device isolated rather than
    # cancelling the serial three-device run before its first device completes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        viewport: [phone, tablet, desktop]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Install Linux Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Device smoke/axe with disposable PostgreSQL
        run: pnpm test:ui --project=${{ matrix.viewport }}

  browser:
    # Keep the existing protected-branch required check name. It must fail when
    # any device fails, is cancelled or is skipped; no continue-on-error path.
    name: Browser smoke and accessibility
    needs: browser_matrix
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all three device jobs to pass
        env:
          BROWSER_RESULT: ${{ needs.browser_matrix.result }}
        run: test "$BROWSER_RESULT" = success

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Audit runtime and development dependencies
        run: pnpm audit --audit-level low
